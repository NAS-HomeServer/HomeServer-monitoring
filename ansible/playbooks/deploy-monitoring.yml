---
- name: "IaC - Deploiement Stack Monitoring (Prometheus / Grafana / cAdvisor)"
  hosts: localhost
  connection: local
  vars:
    compose_project_dir: "/app"          # dossier contenant docker-compose.yml
    compose_project_name: "monitoring-homeserver"

  tasks:
    - name: "Creation des repertoires pour Prometheus"
      file:
        path: "/volume2/docker/prometheus/{{ item }}"
        state: directory
        mode: '0755'
      with_items:
        - 'config'
        - 'data'

    - name: "Creation du repertoire pour Grafana"
      file:
        path: "/volume2/docker/grafana"
        state: directory
        mode: '0755'

    - name: "Nettoyage des conteneurs fantomes"
      command: docker container prune -f
      environment:
        DOCKER_API_VERSION: "1.43"

    - name: "Gestion de la Stack Docker Compose (versions gerees directement dans docker-compose.yml, mises a jour via Renovate)"
      community.docker.docker_compose_v2:
        project_src: "{{ compose_project_dir }}"
        project_name: "{{ compose_project_name }}"
        state: present
        pull: missing
        remove_orphans: true
      environment:
        DOCKER_API_VERSION: "1.43"