---
- name: "IaC - Deploiement Stack Monitoring (Prometheus / Grafana / Alertmanager / cAdvisor / blackbox)"
  hosts: localhost
  connection: local
  vars:
    compose_project_dir: "/app/monitoring"  # dossier contenant docker-compose.yml
    compose_project_name: "homeserver-monitoring"
    repo_root: "{{ playbook_dir }}/../.."
    # vm.swappiness cible (defaut noyau/DSM : 60). Bas = le noyau prefere
    # liberer du cache plutot que pousser des pages en swap.
    vm_swappiness: 10
    # Meme image (et meme digest) que ALPINE_IMAGE dans le workflow.
    sysctl_image: alpine:3.24@sha256:c6b073f8e9e58d881f6ffba6ebf3b9ebd60b9e7d6e8337018c0e68bb5c356873

  tasks:
    - name: "Creation des repertoires pour Prometheus"
      ansible.builtin.file:
        path: "/volume2/docker/prometheus/{{ item }}"
        state: directory
        owner: "1026"
        group: "100"
        mode: '0755'
        recurse: true
      with_items:
        - 'config'
        - 'config/rules'
        - 'data'

    - name: "Creation du repertoire pour Grafana"
      ansible.builtin.file:
        path: "/volume2/docker/grafana/{{ item }}"
        state: directory
        owner: "1026"
        group: "100"
        mode: '0755'
        recurse: true
      with_items:
        - 'provisioning/datasources'
        - 'provisioning/dashboards'
        - 'provisioning/alerting'
        - 'dashboards/Synology DS1525+'
        - 'dashboards/cyberlab'

    - name: "Creation du repertoire de configuration blackbox_exporter"
      ansible.builtin.file:
        path: /volume2/docker/blackbox/config
        state: directory
        owner: "65534"
        group: "65534"
        mode: '0755'

    # Le conteneur alertmanager tourne en "nobody" (65534:65534), image par
    # defaut sans "user:" explicite dans docker-compose.yml (contrairement a
    # Prometheus/Grafana qui imposent 1026:100).
    - name: "Creation des repertoires pour Alertmanager"
      ansible.builtin.file:
        path: "/volume2/docker/alertmanager/{{ item }}"
        state: directory
        owner: "65534"
        group: "65534"
        mode: '0755'
        recurse: true
      with_items:
        - 'config'
        - 'data'

    # Mode 0700 (pas 0755 comme les autres repertoires Alertmanager) : ce
    # dossier ne contient que le secret webhook Discord.
    - name: "Creation du repertoire des secrets Alertmanager"
      ansible.builtin.file:
        path: /volume2/docker/alertmanager/config/secrets
        state: directory
        owner: "65534"
        group: "65534"
        mode: '0700'

    # Deploiement des fichiers de configuration versionnes : doit precéder le
    # "up" Docker Compose ci-dessous, sinon Prometheus/Alertmanager demarrent
    # sans --config.file valide sur un volume tout juste cree (crash-loop).
    # Les handlers de rechargement/redemarrage, notifies ici, ne s'executent
    # qu'a la fin du play (apres le "up"), donc uniquement si le fichier a
    # reellement change ET que le conteneur cible est deja demarre.
    - name: "Deploiement de la configuration Prometheus"
      ansible.builtin.copy:
        src: "{{ repo_root }}/config/prometheus.yml"
        dest: /volume2/docker/prometheus/config/prometheus.yml
        owner: "1026"
        group: "100"
        mode: '0644'
      notify: Recharger Prometheus

    # rule_files: rules/*.yml dans prometheus.yml ne lit que ce repertoire
    # cote NAS : sans cette copie, une regle ajoutee dans le repo ne serait
    # jamais chargee par Prometheus.
    - name: "Deploiement des regles d'alerte Prometheus"
      ansible.builtin.copy:
        src: "{{ repo_root }}/config/rules/"
        dest: /volume2/docker/prometheus/config/rules/
        owner: "1026"
        group: "100"
        mode: '0644'
      notify: Recharger Prometheus

    # copy n'efface jamais ce qui a disparu du repo : sans ce nettoyage, une
    # regle supprimee dans config/rules/ resterait chargee par Prometheus.
    - name: "Recherche des regles d'alerte deployees sur le NAS"
      ansible.builtin.find:
        paths: /volume2/docker/prometheus/config/rules
        patterns: '*.yml,*.yaml'
      register: deployed_rules

    - name: "Suppression des regles d'alerte retirees du repo"
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ deployed_rules.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when: item.path | basename not in repo_rule_names
      vars:
        repo_rule_names: "{{ lookup('ansible.builtin.fileglob', repo_root ~ '/config/rules/*', wantlist=True) | map('basename') | list }}"
      notify: Recharger Prometheus

    - name: "Deploiement de la configuration blackbox_exporter"
      ansible.builtin.copy:
        src: "{{ repo_root }}/config/blackbox/blackbox.yml"
        dest: /volume2/docker/blackbox/config/blackbox.yml
        owner: "65534"
        group: "65534"
        mode: '0644'
      notify: Recharger blackbox_exporter

    - name: "Deploiement de la configuration Alertmanager"
      ansible.builtin.copy:
        src: "{{ repo_root }}/config/alertmanager/alertmanager.yml"
        dest: /volume2/docker/alertmanager/config/alertmanager.yml
        owner: "65534"
        group: "65534"
        mode: '0644'
      notify: Recharger Alertmanager

    # content (pas src) : la valeur vient de l'extra-var discord_webhook_url,
    # jamais d'un fichier versionne. no_log evite que le secret apparaisse en
    # clair dans la sortie du run (Ansible logge par defaut le module_args).
    - name: "Deploiement du secret webhook Discord"
      ansible.builtin.copy:
        content: "{{ discord_webhook_url }}"
        dest: /volume2/docker/alertmanager/config/secrets/discord_webhook
        owner: "65534"
        group: "65534"
        mode: '0400'
      no_log: true
      notify: Recharger Alertmanager

    - name: "Deploiement du provisioning Grafana (datasources)"
      ansible.builtin.copy:
        src: "{{ repo_root }}/config/grafana/provisioning/datasources/"
        dest: /volume2/docker/grafana/provisioning/datasources/
        owner: "1026"
        group: "100"
        mode: '0644'
      notify: Redemarrer Grafana

    - name: "Deploiement du provisioning Grafana (dashboards)"
      ansible.builtin.copy:
        src: "{{ repo_root }}/config/grafana/provisioning/dashboards/"
        dest: /volume2/docker/grafana/provisioning/dashboards/
        owner: "1026"
        group: "100"
        mode: '0644'
      notify: Redemarrer Grafana

    # Le secret Discord n'est pas dans ce fichier : il est lu par Grafana via
    # $__env{GRAFANA_DISCORD_WEBHOOK} (variable d'environnement du conteneur,
    # cf. tache "Gestion de la Stack Docker Compose"). Le volume est monte en :ro.
    - name: "Deploiement du provisioning Grafana (alerting)"
      ansible.builtin.copy:
        src: "{{ repo_root }}/config/grafana/provisioning/alerting/"
        dest: /volume2/docker/grafana/provisioning/alerting/
        owner: "1026"
        group: "100"
        mode: '0644'
      notify: Redemarrer Grafana

    - name: "Deploiement des dashboards Grafana"
      ansible.builtin.copy:
        src: "{{ repo_root }}/config/grafana/dashboards/"
        dest: /volume2/docker/grafana/dashboards/
        owner: "1026"
        group: "100"
        mode: '0644'
      notify: Redemarrer Grafana

    # Le conteneur ansible-runner ne peut ecrire ni /proc/sys ni /etc de l'hote :
    # on passe par un conteneur ephemere privilegie via le socket Docker (vm.* n'est
    # pas namespace, la valeur s'applique donc a l'hote). /etc/sysctl.conf est monte
    # en fichier (cat > en place : sed -i echouerait sur un bind mount) pour que la
    # valeur survive au reboot. "CHANGED" sur stdout pilote changed_when (idempotent).
    - name: "Reglage vm.swappiness de l'hote (a chaud + persistant)"
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --privileged
          - -v
          - /etc/sysctl.conf:/host_sysctl.conf
          - "{{ sysctl_image }}"
          - sh
          - -c
          - |
            set -eu
            want={{ vm_swappiness }}
            if [ "$(sysctl -n vm.swappiness)" != "$want" ]; then
              sysctl -w vm.swappiness="$want" >/dev/null
              echo CHANGED
            fi
            if ! grep -qx "vm.swappiness = $want" /host_sysctl.conf \
               || [ "$(grep -c '^vm.swappiness' /host_sysctl.conf)" -ne 1 ]; then
              { grep -v '^vm.swappiness' /host_sysctl.conf; echo "vm.swappiness = $want"; } > /tmp/sysctl.new
              cat /tmp/sysctl.new > /host_sysctl.conf
              echo CHANGED
            fi
      register: swappiness_result
      changed_when: "'CHANGED' in swappiness_result.stdout"

    # copy n'efface rien : l'ancien dossier "nas" (dashboard Memoire NAS deplace
    # dans "Synology DS1525+") definirait le meme uid deux fois et Grafana
    # refuserait le provisioning. Supprime avant le redemarrage de Grafana.
    - name: "Suppression de l'ancien dossier de dashboards nas"
      ansible.builtin.file:
        path: /volume2/docker/grafana/dashboards/nas
        state: absent
      notify: Redemarrer Grafana

    - name: "Nettoyage des conteneurs fantomes"
      # Filtre sur le projet : sans lui, prune supprime TOUS les conteneurs arretes du NAS
      # (autres stacks comprises : multimedia, cyberlab, hermes-agent, stirling-pdf...).
      ansible.builtin.command: docker container prune -f --filter label=com.docker.compose.project={{ compose_project_name }}
      changed_when: false

    - name: "Gestion de la Stack Docker Compose"
      community.docker.docker_compose_v2:
        project_src: "{{ compose_project_dir }}"
        project_name: "{{ compose_project_name }}"
        state: present
        pull: missing
        remove_orphans: true
      environment:
        DOCKER_API_VERSION: "1.43"
        # Interpole dans docker-compose.yml (--web.external-url de Prometheus).
        PROMETHEUS_EXTERNAL_URL: "{{ prometheus_external_url | default('http://localhost:9090', true) }}"
        # Meme secret que Alertmanager (extra-var discord_webhook_url, issue du
        # secret GitHub DISCORD_WEBHOOK_URL) : jamais ecrit dans Git.
        GRAFANA_DISCORD_WEBHOOK: "{{ discord_webhook_url }}"

  handlers:
    # ansible.builtin.command plutot que community.docker.docker_container_exec/
    # docker_container : ces deux modules Python ont besoin du SDK "docker"
    # (et donc "requests"), absent de l'image ansible-runner (qui n'a que le
    # binaire docker-cli, cf. ci/Dockerfile.ansible-runner). Le CLI est deja
    # utilise ainsi par la tache "Nettoyage des conteneurs fantomes" ci-dessus.
    #
    # --web.enable-lifecycle est actif sur Prometheus (docker-compose.yml) :
    # exec dans le conteneur pour rester dans son propre netns (le conteneur
    # ansible-runner n'a pas acces au reseau "monitoring").
    - name: Recharger Prometheus
      ansible.builtin.command: docker exec prometheus wget -q -O- --post-data='' http://localhost:9090/-/reload
      changed_when: true

    # Le rechargement a chaud d'Alertmanager (POST /-/reload) est disponible
    # sans flag supplementaire, a la difference de Prometheus.
    - name: Recharger Alertmanager
      ansible.builtin.command: docker exec alertmanager wget -q -O- --post-data='' http://localhost:9093/-/reload
      changed_when: true

    # blackbox_exporter recharge sa config sur POST /-/reload (aucun flag
    # requis) ; wget busybox present dans l'image, comme pour les healthchecks.
    - name: Recharger blackbox_exporter
      ansible.builtin.command: docker exec blackbox-exporter wget -q -O- --post-data='' http://localhost:9115/-/reload
      changed_when: true

    # Grafana ne relit son provisioning qu'au demarrage : un redemarrage est
    # necessaire pour appliquer un changement de datasource/dashboard.
    - name: Redemarrer Grafana
      ansible.builtin.command: docker restart grafana
      changed_when: true
