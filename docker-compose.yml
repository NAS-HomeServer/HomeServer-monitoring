services:
  # --- BLOC PROMETHEUS ---
  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: prometheus
    user: "root"
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - /volume2/docker/prometheus/config:/etc/prometheus
      - /volume2/docker/prometheus/data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.no-lockfile'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.retention.size=512MB'
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 256M

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 32M

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /volume2/@docker:/var/lib/docker:ro
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 256M

  # --- BLOC VISUALISATION ---
  grafana:
    image: grafana/grafana:13.1.1
    container_name: grafana
    restart: unless-stopped
    user: "1026:100"
    ports:
      - "3001:3000"
    environment:
      - TZ=Europe/Paris
    volumes:
      - /volume2/docker/grafana:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  monitoring:
    driver: bridge