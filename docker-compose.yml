services:
  # --- BLOC PROMETHEUS ---
  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: prometheus
    user: "root"
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - /volume2/docker/prometheus/config:/etc/prometheus
      - /volume2/docker/prometheus/data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.no-lockfile'
      - '--storage.tsdb.retention.time=3d'
      - '--storage.tsdb.retention.size=256MB'
      - '--storage.tsdb.min-block-duration=2h'
      - '--storage.tsdb.max-block-duration=2h'
      - '--web.enable-lifecycle'
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 160M

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 32M

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    command:
      - '--housekeeping_interval=30s'
      - '--docker_only=true'
      - '--disable_metrics=disk,tcp,udp,sched,hugetlb,referenced_memory,cpu_topology,resctrl'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /volume2/@docker:/var/lib/docker:ro
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 200M

  # --- BLOC ALERTING ---
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - /volume2/docker/alertmanager/config:/etc/alertmanager
      - /volume2/docker/alertmanager/data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 64M

  alertmanager-discord:
    image: rogerrum/alertmanager-discord:main
    container_name: alertmanager-discord
    restart: unless-stopped
    environment:
      - DISCORD_WEBHOOK=${DISCORD_WEBHOOK_URL}
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 32M

  # --- BLOC VISUALISATION ---
  grafana:
    image: grafana/grafana:13.1.1
    container_name: grafana
    restart: unless-stopped
    user: "1026:100"
    ports:
      - "3001:3000"
    environment:
      - TZ=Europe/Paris
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_ALERTING_ENABLED=false
      - GF_UNIFIED_ALERTING_ENABLED=false
      - GOMAXPROCS=1
    volumes:
      - /volume2/docker/grafana:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 300M

networks:
  monitoring:
    driver: bridge
    name: monitoring-homeserver