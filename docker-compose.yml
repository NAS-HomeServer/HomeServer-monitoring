# Sécurité stricte : pas d'escalade de privilèges ni de capabilities. Convient aux images
# qui tournent en non-root (nobody, ou user: explicite) et n'ont rien à chown au démarrage.
x-security-strict: &security-strict
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  # --- BLOC PROMETHEUS ---
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: prometheus
    user: "1026:100"
    <<: *security-strict
    read_only: true
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - prometheus_config:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.no-lockfile'
      - '--storage.tsdb.retention.time=3d'
      - '--storage.tsdb.retention.size=256MB'
      - '--storage.tsdb.min-block-duration=2h'
      - '--storage.tsdb.max-block-duration=2h'
      - '--web.enable-lifecycle'
    networks:
      - monitoring
    mem_limit: 512M
    memswap_limit: 512M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    <<: *security-strict
    read_only: true
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      - monitoring
    mem_limit: 64M
    memswap_limit: 64M

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.2
    container_name: cadvisor
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    command:
      - '--housekeeping_interval=30s'
      - '--docker_only=true'
      - '--disable_metrics=disk,tcp,udp,sched,hugetlb,referenced_memory,cpu_topology,resctrl'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /volume2/@docker:/var/lib/docker:ro
    networks:
      - monitoring
    mem_limit: 200M
    memswap_limit: 200M

  # --- BLOC ALERTING ---
  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: alertmanager
    <<: *security-strict
    read_only: true
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - alertmanager_config:/etc/alertmanager
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - monitoring
    mem_limit: 96M
    memswap_limit: 96M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  alertmanager-discord:
    image: rogerrum/alertmanager-discord:main
    container_name: alertmanager-discord
    <<: *security-strict
    restart: unless-stopped
    environment:
      - DISCORD_WEBHOOK=${DISCORD_WEBHOOK_URL}
      - DISCORD_USERNAME=Alertmanager
    networks:
      - monitoring
    mem_limit: 32M
    memswap_limit: 32M

  # --- BLOC VISUALISATION ---
  grafana:
    image: grafana/grafana:13.2.2
    container_name: grafana
    restart: unless-stopped
    user: "1026:100"
    <<: *security-strict
    ports:
      - "3001:3000"
    environment:
      - TZ=Europe/Paris
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_ALERTING_ENABLED=false
      - GF_UNIFIED_ALERTING_ENABLED=false
      - GOMAXPROCS=1
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitoring
    mem_limit: 512M
    memswap_limit: 512M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

networks:
  monitoring:
    driver: bridge
    name: homeserver-monitoring

# Volumes nommés : driver_opts en bind pointe vers les mêmes chemins hôte
# gérés par Ansible, aucune donnée déplacée, juste un nom lisible par service
# à la place du hash généré par défaut.
volumes:
  prometheus_config:
    name: prometheus_config
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /volume2/docker/prometheus/config
  prometheus_data:
    name: prometheus_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /volume2/docker/prometheus/data
  alertmanager_config:
    name: alertmanager_config
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /volume2/docker/alertmanager/config
  alertmanager_data:
    name: alertmanager_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /volume2/docker/alertmanager/data
  grafana_data:
    name: grafana_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /volume2/docker/grafana
