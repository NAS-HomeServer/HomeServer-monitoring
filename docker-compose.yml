# Sécurité stricte : pas d'escalade de privilèges ni de capabilities. Convient aux images
# qui tournent en non-root (nobody, ou user: explicite) et n'ont rien à chown au démarrage.
x-security-strict: &security-strict
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  # --- BLOC PROMETHEUS ---
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: prometheus
    user: "1026:100"
    <<: *security-strict
    read_only: true
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - prometheus_config:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.no-lockfile'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=2GB'
      - '--web.enable-lifecycle'
    # cyberlab : reseau des backends (dns_analyzer, audit_orchestrator), pour
    # les sonder par nom de conteneur. Cree par cyberlab/docker-compose.yml.
    networks:
      - monitoring
      - cyberlab
    mem_limit: 512M
    memswap_limit: 512M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    <<: *security-strict
    read_only: true
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      - monitoring
    mem_limit: 64M
    memswap_limit: 64M

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.2
    container_name: cadvisor
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    command:
      - '--housekeeping_interval=30s'
      - '--docker_only=true'
      - '--disable_metrics=disk,tcp,udp,sched,hugetlb,referenced_memory,cpu_topology,resctrl'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /volume2/@docker:/var/lib/docker:ro
    networks:
      - monitoring
    mem_limit: 200M
    memswap_limit: 200M

  # --- BLOC SONDES ---
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0
    container_name: blackbox-exporter
    <<: *security-strict
    read_only: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:9115:9115"
    volumes:
      - /volume2/docker/blackbox/config:/etc/blackbox:ro
    command:
      - '--config.file=/etc/blackbox/blackbox.yml'
    networks:
      - monitoring
    mem_limit: 64M
    memswap_limit: 64M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9115/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # --- BLOC ALERTING ---
  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: alertmanager
    <<: *security-strict
    read_only: true
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - alertmanager_config:/etc/alertmanager
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - monitoring
    mem_limit: 96M
    memswap_limit: 96M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # --- BLOC VISUALISATION ---
  grafana:
    image: grafana/grafana:13.2.2
    container_name: grafana
    restart: unless-stopped
    user: "1026:100"
    <<: *security-strict
    ports:
      - "3001:3000"
    environment:
      - TZ=Europe/Paris
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_ALERTING_ENABLED=false
      - GF_UNIFIED_ALERTING_ENABLED=false
      - GOMAXPROCS=2
      - GOMEMLIMIT=800MiB
      - GF_SNAPSHOTS_ENABLED=false
      - GF_NEWS_NEWS_FEED_ENABLED=false
      - GF_PLUGINS_PLUGIN_ADMIN_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - /volume2/docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - /volume2/docker/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - monitoring
    mem_limit: 1G
    memswap_limit: 1G
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

networks:
  monitoring:
    driver: bridge
    name: homeserver-monitoring
  # Cree et possede par cyberlab/docker-compose.yml : external ici pour que
  # le cycle de vie du monitoring (up/down) ne le cree ni ne le supprime.
  cyberlab:
    external: true
    name: cyberlab

# Volumes nommés : external true, deja crees hors du cycle de vie Compose
# (bind vers des chemins geres par Ansible). Docker ne reverifie/reapplique
# jamais le driver_opts d'un volume existant, external evite juste le
# warning de mismatch de label de projet.
# Chemins hote (pour reference, non appliques puisque external) :
#   prometheus_config    -> /volume2/docker/prometheus/config
#   prometheus_data      -> /volume2/docker/prometheus/data
#   alertmanager_config  -> /volume2/docker/alertmanager/config
#   alertmanager_data    -> /volume2/docker/alertmanager/data
#   grafana_data         -> /volume2/docker/grafana
volumes:
  prometheus_config:
    external: true
  prometheus_data:
    external: true
  alertmanager_config:
    external: true
  alertmanager_data:
    external: true
  grafana_data:
    external: true
