version: '3.8'

services:
  # Base de données : Stockage de la configuration et des données de monitoring
  zabbix-db:
    image: mariadb:10.6
    container_name: zabbix-db
    restart: unless-stopped
    command: --character-set-server=utf8 --collation-server=utf8_bin --default-authentication-plugin=mysql_native_password
    volumes:
      - /volume1/docker/zabbix/db_data:/var/lib/mysql
    environment:
      - MYSQL_DATABASE=zabbix
      - MYSQL_USER=zabbix
      - MYSQL_PASSWORD=zabbix_pwd 
      - MYSQL_ROOT_PASSWORD=root_pwd 
    deploy:
      resources:
        limits:
          memory: 512M

  # Serveur Zabbix : Le cerveau qui analyse les données et gère les alertes
  zabbix-server:
    image: zabbix/zabbix-server-mysql:latest
    container_name: zabbix-server
    restart: unless-stopped
    ports:
      - "10051:10051"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /volume1/docker/zabbix/alertscripts:/usr/lib/zabbix/alertscripts
    environment:
      - DB_SERVER_HOST=zabbix-db
      - MYSQL_DATABASE=zabbix
      - MYSQL_USER=zabbix
      - MYSQL_PASSWORD=zabbix_pwd
      - MYSQL_ROOT_PASSWORD=root_pwd
    deploy:
      resources:
        limits:
          memory: 256M

  # Interface Web : Pour la configuration et la visualisation (Bloc 2 du RNCP6)
  zabbix-web:
    image: zabbix/zabbix-web-apache-mysql:latest
    container_name: zabbix-web
    restart: unless-stopped
    ports:
      - "8085:8080" # Accès via http://IP_DU_NAS:8080
    environment:
      - DB_SERVER_HOST=zabbix-db
      - MYSQL_DATABASE=zabbix
      - MYSQL_USER=zabbix
      - MYSQL_PASSWORD=zabbix_pwd
      - MYSQL_ROOT_PASSWORD=root_pwd
      - ZBX_SERVER_HOST=zabbix-server
      - PHP_TZ=Europe/Paris
    deploy:
      resources:
        limits:
          memory: 256M

  # Grafana : Pour tes dashboards avancés (utilisant tes compétences UI/UX [cite: 20, 29])
  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: unless-stopped
    user: "1026:100" # Ton ID utilisateur Synology pour les droits d'écriture
    ports:
      - "3001:3000"
    environment:
      - TZ=Europe/Paris
      - GF_INSTALL_PLUGINS=alexanderzobnin-zabbix-app # Installation auto du plugin Zabbix
    volumes:
      - /volume1/docker/grafana:/var/lib/grafana
    deploy:
      resources:
        limits:
          memory: 256M

  # Agent Zabbix : Pour surveiller les performances locales de ton NAS
  zabbix-agent:
    image: zabbix/zabbix-agent:latest
    container_name: zabbix-agent
    restart: unless-stopped
    privileged: true
    network_mode: host
    environment:
      - ZBX_HOSTNAME=Synology-NAS
      - ZBX_SERVER_HOST=127.0.0.1
    deploy:
      resources:
        limits:
          memory: 64M
