- name: "IaC - Deploiement Stack Monitoring (Prometheus / Grafana)"
  hosts: localhost
  connection: local

  vars:
    grafana_version: "11.6.1"
    prometheus_version: "v3.1.0"
    cadvisor_version: "v0.49.1"

  tasks:
    - name: "Creation des repertoires pour Prometheus"
      file:
        path: "/volume1/docker/prometheus/{{ item }}"
        state: directory
        mode: '0755'
      with_items:
        - 'config'
        - 'data'

    - name: "Creation du repertoire pour Grafana"
      file:
        path: "/volume1/docker/grafana"
        state: directory
        mode: '0755'
        
    - name: "Nettoyage des conteneurs fantômes"
      command: docker container prune -f
    
    - name: "Gestion de la Stack Docker Compose (Prometheus & Grafana)"
      community.docker.docker_compose_v2:
        project_src: "/app"
        project_name: "monitoring-homeserver"
        state: present
        pull: missing
        remove_orphans: true
      environment:
        DOCKER_API_VERSION: "1.43"
        GRAFANA_VERSION: "{{ grafana_version }}"
        PROMETHEUS_VERSION: "{{ prometheus_version }}"
        CADVISOR_VERSION: "{{ cadvisor_version }}"
