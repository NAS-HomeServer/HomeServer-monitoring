---
- name: "IaC - Deploiement Stack Monitoring Zabbix"
  hosts: localhost
  connection: local

  tasks:
    - name: "Creation des repertoires pour Zabbix"
      file:
        path: "/volume1/docker/zabbix/{{ item }}"
        state: directory
        mode: '0755'
      with_items:
        - 'db_data'
        - 'alertscripts'

    - name: "Creation du repertoire pour Grafana"
      file:
        path: "/volume1/docker/grafana"
        state: directory
        mode: '0755'

    - name: "Lancement Docker via Docker Compose"
      shell: "docker-compose -f /app/docker-compose.yml up -d --remove-orphans"
      args:
        chdir: "/monitoring-homeserver"
