---
- name: "IaC - Deploiement Stack Monitoring"
  hosts: localhost
  connection: local

  tasks:
    - name: "Creation des repertoires"
      become: true
      file:
        path: "/volume1/docker/{{ item }}"
        state: directory
        owner: "1026"
        group: "100"
        mode: '0775'
      loop:
        - "prometheus/config"
        - "prometheus/data"
        - "grafana"

    - name: "Copie de la configuration"
      # On prend le fichier à la racine du workspace
      copy:
        src: "prometheus.yml"
        dest: "/volume1/docker/prometheus/config/prometheus.yml"
        owner: "1026"
        group: "100"
        mode: '0644'

    - name: "Lancement Docker"
      shell: "docker compose -f {{ ansible_env.PWD }}/docker-compose.yml up -d --remove-orphans"
      environment:
        DOCKER_HOST: "unix:///var/run/docker.sock"
