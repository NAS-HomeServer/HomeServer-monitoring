---
- name: "IaC - Deploiement Stack Monitoring NAS HomeServer"
  hosts: localhost
  connection: local

  vars:
    base_path: "/volume1/docker"
    user_id: 1026
    group_id: 100

  tasks:
    - name: "Creation des repertoires de config"
      become: true
      file:
        path: "{{ base_path }}/{{ item }}"
        state: directory
        owner: "{{ user_id }}"
        group: "{{ group_id }}"
        mode: '0775'
      loop:
        - "prometheus/config"
        - "prometheus/data"
        - "grafana"

    - name: "Copie de la configuration Prometheus"
      copy:
        src: prometheus.yml 
        dest: "{{ base_path }}/prometheus/config/prometheus.yml"
        owner: "{{ user_id }}"
        group: "{{ group_id }}"
        mode: '0644'

    - name: "Lancement de la stack via Docker-Compose"
      shell: "docker compose -f docker-compose.yml up -d --remove-orphans --wait"
      args:
        chdir: "./" 
      environment:
        DOCKER_HOST: "unix:///var/run/docker.sock"
