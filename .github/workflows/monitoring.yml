name: Pipeline HomeServer Monitoring

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-monitoring-${{ github.ref }}
  cancel-in-progress: false

env:
  WORKSPACE: /volume2/docker/workspace_monitoring
  WORKSPACE_PARENT: /volume2/docker
  RUNNER_DOCKERFILE: ci/Dockerfile.ansible-runner
  TARBALL_URL: https://api.github.com/repos/${{ github.repository }}/tarball/${{ github.sha }}
  COSIGN_IMAGE: gcr.io/projectsigstore/cosign@sha256:9e5c2f2edc34351160407ca3416c61855bdf9403c3c5936e0f0be7fc261611b8
  ALPINE_IMAGE: alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
  # Memes versions que monitoring/docker-compose.yml, pour valider la config avec le
  # meme binaire promtool/amtool que celui qui la chargera en production.
  PROMETHEUS_IMAGE: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
  ALERTMANAGER_IMAGE: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a

jobs:

  # ─────────────────────────────────────────
  # JOB 1 — Code Quality
  # ─────────────────────────────────────────
  lint:
    name: "① Code Quality"
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      # Nettoyage systématique avant checkout : $WORKSPACE est un chemin fixe
      # et persistant sur le runner self-hosted. Sans ce nettoyage, un fichier
      # supprimé dans le commit courant resterait présent (et scanné) d'après
      # un run précédent.
      #
      # Passe par le démon Docker de l'hôte (comme le nettoyage final du job
      # Deploy) plutôt qu'un `mkdir`/`rm` direct dans le shell du runner : ce
      # dernier ne partage pas le même montage /volume2/docker que le vrai
      # disque du NAS (cf. commentaire détaillé dans le job Deploy). Un
      # `mkdir -p "$WORKSPACE"` local ne crée donc rien côté hôte, et le
      # `docker run -v "$WORKSPACE":/workspace` qui suit échoue avec
      # "Bind mount failed: ... does not exist" dès que le répertoire réel
      # a été supprimé pour de bon (cf. le nettoyage final via démon hôte).
      - name: Nettoyage du répertoire (via démon hôte)
        run: |
          docker run --rm -v "$WORKSPACE_PARENT":"$WORKSPACE_PARENT" "$ALPINE_IMAGE" \
            sh -c "mkdir -p '$WORKSPACE' && rm -rf '$WORKSPACE'/*"

      # Le token est passé via un fichier de config curl (jamais en argument
      # de ligne de commande) : sur un runner self-hosted, l'argv complet
      # d'un process est visible via `ps aux` par tout autre utilisateur/
      # process de la machine pendant l'exécution, contrairement au contenu
      # d'un fichier temporaire restreint à 600.
      - name: Récupération du code
        run: |
          cd "$WORKSPACE"
          CURL_CFG=$(mktemp)
          chmod 600 "$CURL_CFG"
          printf 'header = "Authorization: Bearer %s"\n' "${{ secrets.MY_GITHUB_TOKEN }}" > "$CURL_CFG"
          curl -f -L -K "$CURL_CFG" "$TARBALL_URL" -o repo.tar.gz
          rm -f "$CURL_CFG"
          tar -xzf repo.tar.gz --strip-components=1
          rm repo.tar.gz

      - name: ansible-lint
        run: |
          docker run --rm -v "$WORKSPACE":/workspace \
            pipelinecomponents/ansible-lint:0.79.38@sha256:1c4d2abd372a2dce7ea1cb8e27b650db809115d410a87a4aba2438bd028de735 \
            ansible-lint /workspace --profile=production

      - name: yamllint
        run: |
          docker run --rm -v "$WORKSPACE":/workspace \
            pipelinecomponents/yamllint:0.35.13@sha256:5ab5eb7da0ed5e606b07c1723fc8b275e925189f70ac259b26b7329cb5f8f44d \
            yamllint -c /workspace/.yamllint.yml /workspace --strict

      - name: hadolint (Dockerfile lint)
        run: |
          docker run --rm -i \
            hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d \
            hadolint --ignore DL3018 - < "$WORKSPACE/$RUNNER_DOCKERFILE"

      # --entrypoint : l'image prom/prometheus a pour ENTRYPOINT /bin/prometheus,
      # sans override "promtool ..." est passe comme argument a prometheus lui-meme.
      - name: promtool — validation config Prometheus
        run: |
          docker run --rm --entrypoint promtool -v "$WORKSPACE":/workspace \
            "$PROMETHEUS_IMAGE" \
            check config /workspace/config/prometheus.yml

      # config/rules ne contient qu'un .gitkeep pour l'instant (aucune regle
      # d'alerte definie) : on ne fait rien plutot que de faire echouer
      # promtool sur un appel sans argument.
      - name: promtool — validation des règles d'alerte
        run: |
          RULE_FILES=$(find "$WORKSPACE/config/rules" -maxdepth 1 -name '*.yml')
          if [ -z "$RULE_FILES" ]; then
            echo "Aucune règle d'alerte definie, rien à valider."
            exit 0
          fi
          docker run --rm --entrypoint promtool -v "$WORKSPACE":/workspace \
            "$PROMETHEUS_IMAGE" \
            check rules $(echo "$RULE_FILES" | sed "s#$WORKSPACE#/workspace#g")

      # --entrypoint : meme raison que promtool ci-dessus (ENTRYPOINT /bin/alertmanager).
      - name: amtool — validation config Alertmanager
        run: |
          docker run --rm --entrypoint amtool -v "$WORKSPACE":/workspace \
            "$ALERTMANAGER_IMAGE" \
            check-config /workspace/config/alertmanager/alertmanager.yml

  # ─────────────────────────────────────────
  # JOB 2 — Security
  # ─────────────────────────────────────────
  security:
    name: "② Security"
    runs-on: self-hosted
    needs: lint
    timeout-minutes: 15
    steps:
      # Via démon hôte : voir le commentaire détaillé dans le job "① Code
      # Quality".
      - name: Nettoyage du répertoire (via démon hôte)
        run: |
          docker run --rm -v "$WORKSPACE_PARENT":"$WORKSPACE_PARENT" "$ALPINE_IMAGE" \
            sh -c "mkdir -p '$WORKSPACE' && rm -rf '$WORKSPACE'/*"

      - name: Récupération du code
        run: |
          cd "$WORKSPACE"
          CURL_CFG=$(mktemp)
          chmod 600 "$CURL_CFG"
          printf 'header = "Authorization: Bearer %s"\n' "${{ secrets.MY_GITHUB_TOKEN }}" > "$CURL_CFG"
          curl -f -L -K "$CURL_CFG" "$TARBALL_URL" -o repo.tar.gz
          rm -f "$CURL_CFG"
          tar -xzf repo.tar.gz --strip-components=1
          rm repo.tar.gz

      # Image cosign épinglée par digest : évite un `curl | chmod +x` non
      # vérifié sur un binaire "latest" qui servirait justement à vérifier
      # l'authenticité des autres images.
      - name: Cosign — vérification image Trivy
        run: |
          docker run --rm "$COSIGN_IMAGE" verify \
            --certificate-identity-regexp "https://github.com/aquasecurity/trivy" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            ghcr.io/aquasecurity/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa

      # --redact : évite qu'une valeur de secret détectée soit imprimée en
      # clair dans le log du job (persistant sur GitHub Actions) — sinon
      # la fuite dans les logs serait pire que la fuite initiale dans le repo.
      - name: Gitleaks — détection de secrets
        run: |
          docker run --rm -v "$WORKSPACE":/workspace \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source /workspace --no-git --redact --exit-code 1

      # Trivy `config` : scanner de mauvaises configurations IaC (Dockerfile,
      # docker-compose, YAML Ansible/Kubernetes, Terraform...). Ne couvre PAS
      # les vulnérabilités de dépendances (ce serait `trivy fs`) ni les
      # secrets (couvert par Gitleaks ci-dessus).
      #
      # /dev/stdout à l'intérieur du conteneur pointe vers un pipe non
      # seekable : Trivy fait un open()+truncate() sur le chemin de sortie,
      # et truncate() échoue silencieusement sur le bind mount (remapping
      # UID Container Manager Synology) → sortie vide malgré le touch/chmod.
      # Solution : écrire dans le filesystem interne du conteneur (pas de
      # volume), puis extraire via `docker cp`, qui passe par l'API du
      # daemon Docker et gère correctement le remapping.
      #
      # Pas de continue-on-error ici : --exit-code 1 doit faire échouer ce
      # step (et donc bloquer deploy via needs: security) en cas de finding
      # HIGH/CRITICAL réel. Les deux steps suivants restent en if: always()
      # pour produire quand même le résumé et l'artefact SARIF même en cas
      # d'échec de ce step.
      - name: Trivy — scan IaC & fichiers de config
        run: |
          set +e
          CID="trivy-iac-${{ github.run_id }}-${{ github.run_attempt }}"
          docker run --name "$CID" \
            -v "$WORKSPACE":/workspace \
            ghcr.io/aquasecurity/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa config \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --ignorefile /workspace/.trivyignore \
            --format sarif \
            --output /tmp/trivy-iac.sarif \
            /workspace
          SCAN_EXIT=$?
          docker cp "$CID":/tmp/trivy-iac.sarif "$WORKSPACE/trivy-iac.sarif"
          docker rm "$CID" > /dev/null
          set -e
          exit $SCAN_EXIT

      # Vérification post-écriture : on échoue explicitement si le SARIF
      # est vide, plutôt que de laisser passer un faux "0 finding" silencieux.
      - name: Vérifier que le rapport n'est pas vide
        if: always()
        run: |
          [ -s "$WORKSPACE/trivy-iac.sarif" ] || { echo "::error::trivy-iac.sarif est vide (0 octet) — l'écriture du rapport a échoué"; exit 1; }

      # GitHub Advanced Security (code scanning) n'est pas disponible sur ce
      # repo privé sans licence GHAS : l'API code-scanning/sarifs accepte
      # l'upload (202) mais ne traite jamais les résultats. On affiche donc
      # un résumé lisible dans l'onglet Summary, et on garde les SARIF bruts
      # en artefact téléchargeable pour inspection manuelle.
      - name: Résumé des vulnérabilités
        if: always()
        run: |
          echo "## 🔒 Rapport de sécurité" >> "$GITHUB_STEP_SUMMARY"
          clean_files=""
          for f in "$WORKSPACE/trivy-iac.sarif"; do
            [ -f "$f" ] || continue
            total=$(jq '[.runs[].results[]?] | length' "$f" 2>/dev/null)
            errors=$(jq '[.runs[].results[]? | select(.level=="error")] | length' "$f" 2>/dev/null)
            total="${total:-0}"
            errors="${errors:-0}"

            if [ "$errors" -eq 0 ]; then
              clean_files="$clean_files $(basename "$f" .sarif) ($total)"
              continue
            fi

            echo "### $(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
            echo "**$errors** critique(s)/haute(s) sur $total findings au total" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.runs[].results[]? | select(.level=="error") | "- \(.message.text)"' "$f" 2>/dev/null \
              | head -20 >> "$GITHUB_STEP_SUMMARY"
            if [ "$errors" -gt 20 ]; then
              echo "_... et $((errors - 20)) de plus (voir l'artefact SARIF complet)_" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "" >> "$GITHUB_STEP_SUMMARY"
          done

          if [ -n "$clean_files" ]; then
            echo "### ✅ Sans finding critique/haut" >> "$GITHUB_STEP_SUMMARY"
            echo "$clean_files" | tr ' ' '\n' | grep -v '^$' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload des rapports SARIF (artefact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-iac-report-sarif
          path: |
            ${{ env.WORKSPACE }}/trivy-iac.sarif
          retention-days: 30
          if-no-files-found: warn

  # ─────────────────────────────────────────
  # JOB 3 — Build & Scan
  # ─────────────────────────────────────────
  build-scan:
    name: "③ Build & Scan"
    runs-on: self-hosted
    needs: security
    timeout-minutes: 15
    steps:
      # Via démon hôte : voir le commentaire détaillé dans le job "① Code
      # Quality".
      - name: Nettoyage du répertoire (via démon hôte)
        run: |
          docker run --rm -v "$WORKSPACE_PARENT":"$WORKSPACE_PARENT" "$ALPINE_IMAGE" \
            sh -c "mkdir -p '$WORKSPACE' && rm -rf '$WORKSPACE'/*"

      - name: Récupération du code
        run: |
          cd "$WORKSPACE"
          CURL_CFG=$(mktemp)
          chmod 600 "$CURL_CFG"
          printf 'header = "Authorization: Bearer %s"\n' "${{ secrets.MY_GITHUB_TOKEN }}" > "$CURL_CFG"
          curl -f -L -K "$CURL_CFG" "$TARBALL_URL" -o repo.tar.gz
          rm -f "$CURL_CFG"
          tar -xzf repo.tar.gz --strip-components=1
          rm repo.tar.gz

      - name: Cosign — vérification image Trivy
        run: |
          docker run --rm "$COSIGN_IMAGE" verify \
            --certificate-identity-regexp "https://github.com/aquasecurity/trivy" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            ghcr.io/aquasecurity/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa

      - name: Build image Ansible
        run: |
          cd "$WORKSPACE"
          docker build --no-cache -f "$RUNNER_DOCKERFILE" -t ansible-runner:${{ github.sha }} .

      # Même schéma que le scan IaC du job Security : écriture dans le
      # filesystem interne du conteneur puis extraction via `docker cp`, afin
      # de produire un SARIF exploitable même quand le step échoue sur des
      # findings HIGH/CRITICAL (if: always() sur les steps suivants).
      - name: Trivy — scan image construite
        run: |
          set +e
          CID="trivy-image-${{ github.run_id }}-${{ github.run_attempt }}"
          docker run --name "$CID" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            ghcr.io/aquasecurity/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format sarif \
            --output /tmp/trivy-image.sarif \
            ansible-runner:${{ github.sha }}
          SCAN_EXIT=$?
          docker cp "$CID":/tmp/trivy-image.sarif "$WORKSPACE/trivy-image.sarif"
          docker rm "$CID" > /dev/null
          set -e
          exit $SCAN_EXIT

      - name: Vérifier que le rapport n'est pas vide
        if: always()
        run: |
          [ -s "$WORKSPACE/trivy-image.sarif" ] || { echo "::error::trivy-image.sarif est vide (0 octet) — l'écriture du rapport a échoué"; exit 1; }

      - name: Résumé des vulnérabilités (image)
        if: always()
        run: |
          echo "## 🔒 Rapport de sécurité — image construite" >> "$GITHUB_STEP_SUMMARY"
          f="$WORKSPACE/trivy-image.sarif"
          if [ -f "$f" ]; then
            total=$(jq '[.runs[].results[]?] | length' "$f" 2>/dev/null)
            errors=$(jq '[.runs[].results[]? | select(.level=="error")] | length' "$f" 2>/dev/null)
            total="${total:-0}"
            errors="${errors:-0}"

            if [ "$errors" -eq 0 ]; then
              echo "✅ Aucun finding critique/haut ($total au total)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "**$errors** critique(s)/haute(s) sur $total findings au total" >> "$GITHUB_STEP_SUMMARY"
              jq -r '.runs[].results[]? | select(.level=="error") | "- \(.message.text)"' "$f" 2>/dev/null \
                | head -20 >> "$GITHUB_STEP_SUMMARY"
              if [ "$errors" -gt 20 ]; then
                echo "_... et $((errors - 20)) de plus (voir l'artefact SARIF complet)_" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          fi

      - name: Upload du rapport SARIF image (artefact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-image-report-sarif
          path: |
            ${{ env.WORKSPACE }}/trivy-image.sarif
          retention-days: 30
          if-no-files-found: warn

      - name: Trivy — génération SBOM (CycloneDX)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            ghcr.io/aquasecurity/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image --format cyclonedx ansible-runner:${{ github.sha }} \
            > "$WORKSPACE/sbom.cdx.json"

      - name: Vérifier que le SBOM n'est pas vide
        run: |
          [ -s "$WORKSPACE/sbom.cdx.json" ] || { echo "::error::sbom.cdx.json est vide (0 octet) — l'écriture du rapport a échoué"; exit 1; }

      - name: Upload SBOM (artefact)
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx-json
          path: ${{ env.WORKSPACE }}/sbom.cdx.json
          retention-days: 90

      # Le job deploy réutilise cette image via son tag (même runner, même
      # démon Docker) — si un step échoue avant la fin de ce job, personne
      # d'autre ne la nettoiera, donc on s'en charge ici.
      - name: Cleanup en cas d'échec
        if: failure()
        run: docker rmi ansible-runner:${{ github.sha }} || true

  # ─────────────────────────────────────────
  # JOB 4 — Deploy
  # ─────────────────────────────────────────
  deploy:
    name: "④ Deploy"
    runs-on: self-hosted
    needs: build-scan
    environment: production
    timeout-minutes: 10
    steps:
      # Le secret DISCORD_WEBHOOK_URL (environnement production) est passe
      # directement au playbook via --extra-vars, sans fichier .env
      # intermediaire sur le disque du runner : seul le receiver Discord
      # natif d'Alertmanager (config/alertmanager/alertmanager.yml) en a
      # besoin, plus de relais a configurer via .env.
      #
      # Image ansible-runner:${{ github.sha }} déjà construite et scannée
      # par le job build-scan (même runner self-hosted, pas de re-build).
      - name: Exécution du playbook
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PROMETHEUS_EXTERNAL_URL: ${{ vars.PROMETHEUS_EXTERNAL_URL }}
        run: |
          docker run --rm \
            -e ANSIBLE_FORCE_COLOR=1 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /volume2/docker:/volume2/docker \
            ansible-runner:${{ github.sha }} \
            ansible-playbook \
              -i ansible/inventory/hosts.ini \
              ansible/playbooks/deploy-monitoring.yml \
              --extra-vars "discord_webhook_url=${DISCORD_WEBHOOK_URL}" \
              --extra-vars "prometheus_external_url=${PROMETHEUS_EXTERNAL_URL}"

      # Supprime tout le répertoire (pas seulement son contenu) en fin de
      # pipeline : $WORKSPACE est un chemin fixe et persistant sur le runner
      # self-hosted, sur lequel le code source complet du repo reste sinon
      # présent entre deux runs. Chaque job le recrée déjà automatiquement
      # via `mkdir -p "$WORKSPACE"` en début de run, donc pas besoin de le
      # recréer manuellement avant le prochain déclenchement.
      # IMPORTANT : un `rm -rf "$WORKSPACE"` direct dans le shell du runner
      # ne suffit pas — le conteneur du runner GitHub n'a pas le même montage
      # /volume2/docker que le vrai disque du NAS (vérifié sur le repo
      # HomeServer-multimedia : `ls` en SSH sur le NAS et `ls` dans le runner
      # ne donnent pas le même résultat, le contenu du workspace restait donc
      # physiquement sur le disque). En passant par `docker run` avec le
      # socket Docker de l'hôte, le chemin est résolu par le démon Docker de
      # l'hôte lui-même, donc sur le vrai /volume2/docker.
      # Réutilise l'image déjà construite et scannée par "③ Build & Scan",
      # avant sa suppression juste après.
      - name: Nettoyage final du workspace (via démon hôte)
        if: always()
        run: |
          docker run --rm -v /volume2/docker:/volume2/docker \
            ansible-runner:${{ github.sha }} \
            rm -rf /volume2/docker/workspace_monitoring

      - name: Cleanup image
        if: always()
        run: docker rmi ansible-runner:${{ github.sha }} || true
