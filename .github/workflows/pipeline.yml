name: Pipeline HomeServer Monitoring

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: deploy-monitoring-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ─────────────────────────────────────────
  # JOB 1 — Code Quality
  # ─────────────────────────────────────────
  lint:
    name: "① Code Quality"
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Récupération du code
        run: |
          set -euo pipefail
          mkdir -p /volume2/docker/monitoring_workspace
          cd /volume2/docker/monitoring_workspace
          curl -f -L \
            -H "Authorization: Bearer ${{ secrets.MY_GITHUB_TOKEN }}" \
            https://api.github.com/repos/NAS-HomeServer/HomeServer-monitoring/tarball/main \
            -o repo.tar.gz
          tar -xzf repo.tar.gz --strip-components=1
          rm repo.tar.gz

      - name: Partage du code aux jobs suivants
        uses: actions/upload-artifact@v7
        with:
          name: source-code
          path: /volume2/docker/monitoring_workspace
          retention-days: 1

      - name: ansible-lint
        run: |
          docker run --rm \
            -v /volume2/docker/monitoring_workspace:/workspace \
            pipelinecomponents/ansible-lint:0.58.0@sha256:937b425d2f0a80f560b5d393af17840b7989e31b1b231dce7a395509dc879012 \
            ansible-lint /workspace --profile=production

      - name: yamllint
        run: |
          docker run --rm \
            -v /volume2/docker/monitoring_workspace:/workspace \
            pipelinecomponents/yamllint:0.28.0@sha256:2bda65c6d929f287d1107c35de76ce0b750068de659d61de463ffc2e35586137 \
            yamllint /workspace --strict

      - name: hadolint (Dockerfile lint)
        run: |
          docker run --rm -i \
            hadolint/hadolint:v2.12.0@sha256:30a8fd2e785ab6176eed53f74769e04f125afb2f74a6c52aef7d463583b6d45e \
            hadolint --ignore DL3018 - << 'EOF'
          FROM alpine/ansible:2.20.0
          RUN apk update && apk upgrade --no-cache && \
              apk add --no-cache docker-cli docker-cli-compose
          COPY . /app
          WORKDIR /app
          EOF

  # ─────────────────────────────────────────
  # JOB 2 — SECURITY SCAN
  # ─────────────────────────────────────────
  security-scan:
    name: "② Security"
    runs-on: self-hosted
    needs: lint
    timeout-minutes: 15
    steps:
      - name: Nettoyage du répertoire
        run: |
          set -euo pipefail
          mkdir -p /volume2/docker/monitoring_workspace
          find /volume2/docker/monitoring_workspace -mindepth 1 -delete

      - name: Récupération du code (artifact du job lint)
        uses: actions/download-artifact@v8
        with:
          name: source-code
          path: /volume2/docker/monitoring_workspace

      - name: Installer cosign
        run: |
          curl -sSL -o /usr/local/bin/cosign \
            https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64
          chmod +x /usr/local/bin/cosign
          cosign version

      - name: Cosign — vérification image Trivy
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/aquasecurity/trivy" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            ghcr.io/aquasecurity/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c

      - name: Gitleaks — détection de secrets
        run: |
          docker run --rm \
            -v /volume2/docker/monitoring_workspace:/workspace \
            zricethezav/gitleaks:v8.21.2@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46 \
            detect --source /workspace \
            --no-git \
            --exit-code 1

      - name: Trivy — scan IaC & fichiers de config
        run: |
          docker run --rm \
            -v /volume2/docker/monitoring_workspace:/workspace \
            ghcr.io/aquasecurity/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c \
            config \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --format sarif \
            --output /workspace/trivy-iac.sarif \
            /workspace

      - name: Upload SARIF → GitHub Security tab
        if: always()
        run: |
          set -euo pipefail
          f=/volume2/docker/monitoring_workspace/trivy-iac.sarif
          if [ -f "$f" ]; then
            echo "Upload de $f"
            curl -fsSL \
              -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              https://api.github.com/repos/${{ github.repository }}/code-scanning/sarifs \
              -d "{\"commit_sha\":\"${{ github.sha }}\",\"ref\":\"refs/heads/main\",\"sarif\":\"$(gzip -c $f | base64 -w0)\"}"
          fi

  # ─────────────────────────────────────────
  # JOB 3 — DEPLOY
  # ─────────────────────────────────────────
  deploy:
    name: "③ Deploy"
    runs-on: self-hosted
    needs: security-scan
    environment: production
    timeout-minutes: 20
    steps:
      - name: Nettoyage du répertoire
        run: |
          set -euo pipefail
          mkdir -p /volume2/docker/monitoring_workspace
          find /volume2/docker/monitoring_workspace -mindepth 1 -delete

      - name: Récupération du code (artifact du job lint)
        uses: actions/download-artifact@v8
        with:
          name: source-code
          path: /volume2/docker/monitoring_workspace

      - name: Installer cosign
        run: |
          curl -sSL -o /usr/local/bin/cosign \
            https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64
          chmod +x /usr/local/bin/cosign
          cosign version

      - name: Cosign — vérification image Trivy
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/aquasecurity/trivy" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            ghcr.io/aquasecurity/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c

      - name: Créer le fichier .env avec les secrets
        run: |
          set -euo pipefail
          {
            echo "DISCORD_WEBHOOK_URL=${{ secrets.DISCORD_WEBHOOK_URL }}"
          } > /volume2/docker/monitoring_workspace/.env
          chmod 600 /volume2/docker/monitoring_workspace/.env

      - name: Build image Ansible
        run: |
          set -euo pipefail
          cd /volume2/docker/monitoring_workspace
          cat > Dockerfile <<'EOF'
          FROM alpine/ansible:2.20.0@sha256:0a4a5b8808ed81a386d0acb04743de9c377a01cfb27580c54b1c8ee79da57e96
          RUN apk update && apk upgrade --no-cache && \
              apk add --no-cache docker-cli docker-cli-compose
          COPY . /app
          WORKDIR /app
          EOF
          docker build -t ansible-runner:${{ github.sha }} .

      - name: Trivy — scan image construite
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            ghcr.io/aquasecurity/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c \
            image \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            ansible-runner:${{ github.sha }}

      - name: Trivy — génération SBOM (CycloneDX)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            ghcr.io/aquasecurity/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c \
            image --format cyclonedx ansible-runner:${{ github.sha }} \
            > /volume2/docker/monitoring_workspace/sbom.cdx.json

      - name: Upload SBOM (artifact)
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.sha }}
          path: /volume2/docker/monitoring_workspace/sbom.cdx.json
          retention-days: 90

      - name: Exécution du playbook
        run: |
          set -euo pipefail
          set -a; source /volume2/docker/monitoring_workspace/.env; set +a
          docker run --rm \
            -e ANSIBLE_HOST_KEY_CHECKING=False \
            -e ANSIBLE_FORCE_COLOR=1 \
            -e DOCKER_API_VERSION=1.43 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /volume2/docker:/volume2/docker \
            ansible-runner:${{ github.sha }} \
            ansible-playbook \
              -i ansible/inventory/hosts.ini \
              ansible/playbooks/deploy-monitoring.yml \
              --extra-vars "discord_webhook_url=${DISCORD_WEBHOOK_URL}"

      - name: Cleanup image
        if: always()
        run: docker rmi ansible-runner:${{ github.sha }} || true