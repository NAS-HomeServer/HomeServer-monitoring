name: Pipeline HomeServer Monitoring

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: deploy-monitoring-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ─────────────────────────────────────────
  # JOB 1 — LINT
  # ─────────────────────────────────────────
  lint:
    name: "① Lint"
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Récupération du code
        run: |
          set -euo pipefail
          mkdir -p /volume2/docker/monitoring_workspace
          cd /volume2/docker/monitoring_workspace
          curl -f -L \
            -H "Authorization: Bearer ${{ secrets.MY_GITHUB_TOKEN }}" \
            https://api.github.com/repos/NAS-HomeServer/HomeServer-monitoring/tarball/main \
            -o repo.tar.gz
          tar -xzf repo.tar.gz --strip-components=1
          rm repo.tar.gz

      - name: Partage du code aux jobs suivants
        uses: actions/upload-artifact@v4
        with:
          name: source-code
          path: /volume2/docker/monitoring_workspace
          retention-days: 1

      - name: ansible-lint
        run: |
          docker run --rm \
            -v /volume2/docker/monitoring_workspace:/workspace \
            pipelinecomponents/ansible-lint:latest \
            ansible-lint /workspace --profile=production

      - name: yamllint
        run: |
          docker run --rm \
            -v /volume2/docker/monitoring_workspace:/workspace \
            pipelinecomponents/yamllint:latest \
            yamllint /workspace --strict

      - name: hadolint (Dockerfile lint)
        run: |
          docker run --rm -i hadolint/hadolint:latest hadolint \
            --ignore DL3018 \
            - << 'EOF'
          FROM alpine/ansible:2.20.0
          RUN apk update && apk upgrade --no-cache && \
              apk add --no-cache docker-cli docker-cli-compose
          COPY . /app
          WORKDIR /app
          EOF

  # ─────────────────────────────────────────
  # JOB 2 — SECURITY SCAN
  # ─────────────────────────────────────────
  security-scan:
    name: "② Security"
    runs-on: self-hosted
    needs: lint
    timeout-minutes: 15
    steps:
      - name: Nettoyage du répertoire
        run: |
          set -euo pipefail
          mkdir -p /volume2/docker/monitoring_workspace
          find /volume2/docker/monitoring_workspace -mindepth 1 -delete

      - name: Récupération du code (artifact du job lint)
        uses: actions/download-artifact@v8
        with:
          name: source-code
          path: /volume2/docker/monitoring_workspace

      - name: Gitleaks — détection de secrets
        run: |
          docker run --rm \
            -v /volume2/docker/monitoring_workspace:/workspace \
            zricethezav/gitleaks:latest \
            detect --source /workspace \
            --no-git \
            --exit-code 1

      - name: Semgrep — SAST
        run: |
          docker run --rm \
            -v /volume2/docker/monitoring_workspace:/workspace \
            -w /workspace \
            semgrep/semgrep:1.95.0 \
            semgrep scan \
              --config p/ci \
              --config p/security-audit \
              --config p/dockerfile \
              --config p/yaml \
              --config p/github-actions \
              --sarif --output=/workspace/semgrep.sarif \
              --error || true

      - name: Trivy — scan IaC & fichiers de config
        run: |
          docker run --rm \
            -v /volume2/docker/monitoring_workspace:/workspace \
            ghcr.io/aquasecurity/trivy:0.70.0 \
            config \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --format sarif \
            --output /workspace/trivy-iac.sarif \
            /workspace

      - name: Upload SARIF → GitHub Security tab
        if: always()
        run: |
          set -euo pipefail
          for f in /volume2/docker/monitoring_workspace/semgrep.sarif \
                   /volume2/docker/monitoring_workspace/trivy-iac.sarif; do
            [ -f "$f" ] || continue
            echo "Upload de $f"
            curl -fsSL \
              -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              https://api.github.com/repos/${{ github.repository }}/code-scanning/sarifs \
              -d "{\"commit_sha\":\"${{ github.sha }}\",\"ref\":\"refs/heads/main\",\"sarif\":\"$(gzip -c $f | base64 -w0)\"}"
          done

  # ─────────────────────────────────────────
  # JOB 3 — DEPLOY
  # ─────────────────────────────────────────
  deploy:
    name: "③ Deploy"
    runs-on: self-hosted
    needs: security-scan
    environment: production
    timeout-minutes: 20
    steps:
      - name: Nettoyage du répertoire
        run: |
          set -euo pipefail
          mkdir -p /volume2/docker/monitoring_workspace
          find /volume2/docker/monitoring_workspace -mindepth 1 -delete

      - name: Récupération du code (artifact du job lint)
        uses: actions/download-artifact@v8
        with:
          name: source-code
          path: /volume2/docker/monitoring_workspace

      - name: Build image Ansible
        run: |
          set -euo pipefail
          cd /volume2/docker/monitoring_workspace
          cat > Dockerfile <<'EOF'
          FROM alpine/ansible:2.20.0
          RUN apk update && apk upgrade --no-cache && \
              apk add --no-cache docker-cli docker-cli-compose
          COPY . /app
          WORKDIR /app
          EOF
          docker build -t ansible-runner:${{ github.sha }} .

      - name: Trivy — scan image construite
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            ghcr.io/aquasecurity/trivy:0.70.0 \
            image \
            --exit-code 1 \
            --severity CRITICAL \
            --ignore-unfixed \
            ansible-runner:${{ github.sha }}

      - name: Exécution du playbook
        run: |
          set -euo pipefail
          docker run --rm \
            -e ANSIBLE_HOST_KEY_CHECKING=False \
            -e ANSIBLE_FORCE_COLOR=1 \
            -e DOCKER_API_VERSION=1.43 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /volume2/docker:/volume2/docker \
            ansible-runner:${{ github.sha }} \
            ansible-playbook \
              -i ansible/inventory/hosts.ini \
              ansible/playbooks/deploy-monitoring.yml

      - name: Cleanup image
        if: always()
        run: docker rmi ansible-runner:${{ github.sha }} || true