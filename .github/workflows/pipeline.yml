name: Pipeline HomeServer Monitoring

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-monitoring-${{ github.ref }}
  cancel-in-progress: false

env:
  WORKSPACE: /volume2/docker/monitoring_workspace
  TARBALL_URL: https://api.github.com/repos/${{ github.repository }}/tarball/main

jobs:

  # ─────────────────────────────────────────
  # JOB 1 — Code Quality
  # ─────────────────────────────────────────
  lint:
    name: "① Code Quality"
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Récupération du code
        run: |
          mkdir -p "$WORKSPACE"
          cd "$WORKSPACE"
          curl -f -L \
            -H "Authorization: Bearer ${{ secrets.MY_GITHUB_TOKEN }}" \
            "$TARBALL_URL" -o repo.tar.gz
          tar -xzf repo.tar.gz --strip-components=1
          rm repo.tar.gz

      - name: ansible-lint
        run: |
          docker run --rm -v "$WORKSPACE":/workspace \
            pipelinecomponents/ansible-lint:0.58.0@sha256:937b425d2f0a80f560b5d393af17840b7989e31b1b231dce7a395509dc879012 \
            ansible-lint /workspace --profile=production

      - name: yamllint
        run: |
          docker run --rm -v "$WORKSPACE":/workspace \
            pipelinecomponents/yamllint:0.28.0@sha256:2bda65c6d929f287d1107c35de76ce0b750068de659d61de463ffc2e35586137 \
            yamllint /workspace --strict

      - name: hadolint (Dockerfile lint)
        run: |
          docker run --rm -i \
            hadolint/hadolint:v2.12.0@sha256:30a8fd2e785ab6176eed53f74769e04f125afb2f74a6c52aef7d463583b6d45e \
            hadolint --ignore DL3018 - << 'EOF'
          FROM alpine/ansible:2.20.0@sha256:0a4a5b8808ed81a386d0acb04743de9c377a01cfb27580c54b1c8ee79da57e96
          RUN apk update && apk upgrade --no-cache && \
              apk add --no-cache docker-cli docker-cli-compose
          COPY . /app
          WORKDIR /app
          EOF

  # ─────────────────────────────────────────
  # JOB 2 — Security
  # ─────────────────────────────────────────
  security:
    name: "② Security"
    runs-on: self-hosted
    needs: lint
    timeout-minutes: 15
    steps:
      - name: Récupération du code
        run: |
          mkdir -p "$WORKSPACE"
          cd "$WORKSPACE"
          curl -f -L \
            -H "Authorization: Bearer ${{ secrets.MY_GITHUB_TOKEN }}" \
            "$TARBALL_URL" -o repo.tar.gz
          tar -xzf repo.tar.gz --strip-components=1
          rm repo.tar.gz

      - name: Installer cosign
        run: |
          curl -sSL -o /usr/local/bin/cosign \
            https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64
          chmod +x /usr/local/bin/cosign
          cosign version

      - name: Cosign — vérification image Trivy
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/aquasecurity/trivy" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            ghcr.io/aquasecurity/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c

      - name: Gitleaks — détection de secrets
        run: |
          docker run --rm -v "$WORKSPACE":/workspace \
            zricethezav/gitleaks:v8.21.2@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46 \
            detect --source /workspace --no-git --exit-code 1
        continue-on-error: true

      # Trivy `config` : scanner de mauvaises configurations IaC (Dockerfile,
      # docker-compose, YAML Ansible/Kubernetes, Terraform...). Ne couvre PAS
      # les vulnérabilités de dépendances (ce serait `trivy fs`) ni les
      # secrets (couvert par Gitleaks ci-dessus).
      #
      # Pas de continue-on-error ici : --exit-code 1 doit faire échouer ce
      # step (et donc bloquer deploy via needs: security) en cas de finding
      # HIGH/CRITICAL réel. Les deux steps suivants restent en if: always()
      # pour produire quand même le résumé et l'artefact SARIF même en cas
      # d'échec de ce step.
      - name: Trivy — scan IaC & fichiers de config
        run: |
          touch "$WORKSPACE/trivy-iac.sarif"
          chmod 666 "$WORKSPACE/trivy-iac.sarif"
          docker run --rm -v "$WORKSPACE":/workspace \
            ghcr.io/aquasecurity/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c config \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --format sarif \
            --output /workspace/trivy-iac.sarif \
            /workspace

      # GitHub Advanced Security (code scanning) n'est pas disponible sur ce
      # repo privé sans licence GHAS : l'API code-scanning/sarifs accepte
      # l'upload (202) mais ne traite jamais les résultats. On affiche donc
      # un résumé lisible dans l'onglet Summary, et on garde les SARIF bruts
      # en artefact téléchargeable pour inspection manuelle.
      - name: Résumé des vulnérabilités
        if: always()
        run: |
          echo "## 🔒 Rapport de sécurité" >> "$GITHUB_STEP_SUMMARY"
          clean_files=""
          for f in "$WORKSPACE/trivy-iac.sarif"; do
            [ -f "$f" ] || continue
            total=$(jq '[.runs[].results[]?] | length' "$f" 2>/dev/null)
            errors=$(jq '[.runs[].results[]? | select(.level=="error")] | length' "$f" 2>/dev/null)
            total="${total:-0}"
            errors="${errors:-0}"

            if [ "$errors" -eq 0 ]; then
              clean_files="$clean_files $(basename "$f" .sarif) ($total)"
              continue
            fi

            echo "### $(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
            echo "**$errors** critique(s)/haute(s) sur $total findings au total" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.runs[].results[]? | select(.level=="error") | "- \(.message.text)"' "$f" 2>/dev/null \
              | head -20 >> "$GITHUB_STEP_SUMMARY"
            if [ "$errors" -gt 20 ]; then
              echo "_... et $((errors - 20)) de plus (voir l'artefact SARIF complet)_" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "" >> "$GITHUB_STEP_SUMMARY"
          done

          if [ -n "$clean_files" ]; then
            echo "### ✅ Sans finding critique/haut" >> "$GITHUB_STEP_SUMMARY"
            echo "$clean_files" | tr ' ' '\n' | grep -v '^$' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload des rapports SARIF (artefact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-security-report
          path: |
            ${{ env.WORKSPACE }}/trivy-iac.sarif
          retention-days: 30
          if-no-files-found: warn

  # ─────────────────────────────────────────
  # JOB 3 — Deploy
  # ─────────────────────────────────────────
  deploy:
    name: "③ Deploy"
    runs-on: self-hosted
    needs: security
    environment: production
    timeout-minutes: 20
    steps:
      - name: Nettoyage du répertoire
        run: |
          mkdir -p "$WORKSPACE"
          rm -rf "$WORKSPACE"/*

      - name: Récupération du code
        run: |
          cd "$WORKSPACE"
          curl -f -L \
            -H "Authorization: Bearer ${{ secrets.MY_GITHUB_TOKEN }}" \
            "$TARBALL_URL" -o repo.tar.gz
          tar -xzf repo.tar.gz --strip-components=1
          rm repo.tar.gz

      - name: Installer cosign
        run: |
          curl -sSL -o /usr/local/bin/cosign \
            https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64
          chmod +x /usr/local/bin/cosign
          cosign version

      - name: Cosign — vérification image Trivy
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/aquasecurity/trivy" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            ghcr.io/aquasecurity/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c

      - name: Créer le fichier .env avec les secrets
        run: |
          {
            echo "DISCORD_WEBHOOK_URL=${{ secrets.DISCORD_WEBHOOK_URL }}"
          } > "$WORKSPACE/.env"
          chmod 600 "$WORKSPACE/.env"

      - name: Build image Ansible
        run: |
          cd "$WORKSPACE"
          cat > Dockerfile <<'EOF'
          FROM alpine/ansible:2.20.0@sha256:0a4a5b8808ed81a386d0acb04743de9c377a01cfb27580c54b1c8ee79da57e96
          RUN apk update && apk upgrade --no-cache && \
              apk add --no-cache docker-cli docker-cli-compose
          COPY . /app
          WORKDIR /app
          EOF
          docker build -t ansible-runner:${{ github.sha }} .

      - name: Trivy — scan image construite
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            ghcr.io/aquasecurity/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c \
            image \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            ansible-runner:${{ github.sha }}

      - name: Trivy — génération SBOM (CycloneDX)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            ghcr.io/aquasecurity/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c \
            image --format cyclonedx ansible-runner:${{ github.sha }} \
            > "$WORKSPACE/sbom.cdx.json"

      - name: Upload SBOM (artefact)
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: ${{ env.WORKSPACE }}/sbom.cdx.json
          retention-days: 90

      - name: Exécution du playbook
        run: |
          set -a; source "$WORKSPACE/.env"; set +a
          docker run --rm \
            -e ANSIBLE_FORCE_COLOR=1 \
            -e DOCKER_API_VERSION=1.43 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /volume2/docker:/volume2/docker \
            ansible-runner:${{ github.sha }} \
            ansible-playbook \
              -i ansible/inventory/hosts.ini \
              ansible/playbooks/deploy-monitoring.yml \
              --extra-vars "discord_webhook_url=${DISCORD_WEBHOOK_URL}"

      - name: Cleanup image
        if: always()
        run: docker rmi ansible-runner:${{ github.sha }} || true