name: Pipeline Monitoring

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write  # pour upload SARIF

concurrency:
  group: deploy-monitoring-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────── SAST : code & IaC ───────────
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Semgrep (SAST)
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/ci
            p/security-audit
            p/dockerfile
            p/yaml
            p/github-actions
          generateSarif: true

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Trivy - scan IaC & config
        uses: aquasecurity/trivy-action@ed142fd  # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy config SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

  # ─────────── Build + scan image + deploy ───────────
  deploy:
    needs: security-scan
    if: github.event_name != 'pull_request'
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      WORKSPACE: /volume1/docker/monitoring_workspace
      IMAGE_TAG: ansible-runner:${{ github.sha }}

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Préparation du workspace
        run: |
          set -euo pipefail
          mkdir -p "${WORKSPACE}"
          find "${WORKSPACE}" -mindepth 1 -delete
          cp -r repo/. "${WORKSPACE}/"

      - name: Build image Ansible
        working-directory: ${{ env.WORKSPACE }}
        run: |
          set -euo pipefail
          cat > Dockerfile <<'EOF'
          FROM alpine/ansible:11.1.0
          RUN apk add --no-cache docker-cli docker-cli-compose
          COPY . /app
          WORKDIR /app
          USER 1026:100
          EOF
          docker build -t "${IMAGE_TAG}" .

      - name: Trivy - scan image
        uses: aquasecurity/trivy-action@ed142fd  # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library

      - name: Upload Trivy image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Exécution du playbook
        working-directory: ${{ env.WORKSPACE }}
        run: |
          set -euo pipefail
          docker run --rm \
            --network none \
            -e ANSIBLE_HOST_KEY_CHECKING=False \
            -e DOCKER_API_VERSION=1.43 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /volume1/docker:/volume1/docker \
            "${IMAGE_TAG}" \
            ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/deploy-monitoring.yml

      - name: Nettoyage image
        if: always()
        run: docker rmi "${IMAGE_TAG}" || true
