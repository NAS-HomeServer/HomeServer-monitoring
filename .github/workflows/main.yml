name: Deploiement Automatique Monitoring
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Nettoyage et Recuperation
        run: |
          # On repart de zéro dans le dossier de travail
          rm -rf ./*
          curl -L -u "axelginepro:${{ secrets.MY_GITHUB_TOKEN }}" \
            https://api.github.com/repos/NAS-HomeServer/Monitoring_HomeServer/tarball/main -o repo.tar.gz
          # --strip-components=1 est la clé : il extrait les fichiers SANS le dossier parent
          tar -xzf repo.tar.gz --strip-components=1
          rm repo.tar.gz

      - name: Execution Ansible
        run: |
          # On lance Ansible directement, car hosts.ini et le playbook sont à la racine
          ansible-playbook -i hosts.ini deploy-monitoring.yml
