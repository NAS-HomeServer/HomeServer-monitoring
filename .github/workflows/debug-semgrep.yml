name: Debug Semgrep

on:
  workflow_dispatch:

jobs:
  debug-semgrep:
    name: "🔧 Debug Semgrep"
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Recuperation du code
        run: |
          set -euo pipefail
          mkdir -p /volume2/docker/monitoring_workspace
          cd /volume2/docker/monitoring_workspace
          curl -f -L \
            -H "Authorization: Bearer ${{ secrets.MY_GITHUB_TOKEN }}" \
            https://api.github.com/repos/NAS-HomeServer/HomeServer-monitoring/tarball/main \
            -o repo.tar.gz
          tar -xzf repo.tar.gz --strip-components=1
          rm repo.tar.gz

      - name: Test A p ci sur tmp vide sans mount
        run: |
          docker run --rm \
            --entrypoint sh \
            semgrep/semgrep:1.95.0 \
            -c "mkdir -p /tmp/empty && cd /tmp/empty && echo test > a.txt && semgrep scan --config p/ci --debug > /tmp/logA.txt 2>&1; echo EXIT:\$?; cat /tmp/logA.txt"

      - name: Test B permissions sur volume monte
        run: |
          docker run --rm \
            -v /volume2/docker/monitoring_workspace:/workspace \
            --entrypoint sh \
            semgrep/semgrep:1.95.0 \
            -c "id; ls -la /workspace | head -5; whoami; touch /workspace/test_write.txt && echo WRITE_OK || echo WRITE_FAIL; rm -f /workspace/test_write.txt"

      - name: Test C config local sur volume monte
        run: |
          docker run --rm \
            -v /volume2/docker/monitoring_workspace:/workspace \
            -w /workspace \
            semgrep/semgrep:1.95.0 \
            sh -c "printf 'rules:\n  - id: test-rule\n    pattern: print(...)\n    message: test\n    languages: [python]\n    severity: WARNING\n' > /tmp/test.yml && semgrep scan --config /tmp/test.yml --debug > /tmp/logC.txt 2>&1; echo EXIT:\$?; cat /tmp/logC.txt"