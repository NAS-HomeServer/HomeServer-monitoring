name: Debug Semgrep

on:
  workflow_dispatch:

jobs:
  debug-semgrep:
    name: "🔧 Debug Semgrep"
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Telecharger les regles en local
        run: |
          mkdir -p /tmp/semgrep-rules
          curl -fsSL https://semgrep.dev/c/p/ci -o /tmp/semgrep-rules/ci.yml
          curl -fsSL https://semgrep.dev/c/p/security-audit -o /tmp/semgrep-rules/security-audit.yml
          echo "Taille des fichiers telecharges:"
          ls -lh /tmp/semgrep-rules/

      - name: Semgrep avec regles locales telechargees
        run: |
          docker run --rm \
            -v /tmp/semgrep-rules:/rules \
            --entrypoint sh \
            semgrep/semgrep:1.95.0 \
            -c "mkdir -p /tmp/src && echo 'print(1)' > /tmp/src/a.py && cd /tmp/src && semgrep scan --config /rules/ci.yml --config /rules/security-audit.yml --debug 2>&1; echo EXIT:\$?"