name: Debug Semgrep

on:
  workflow_dispatch:

jobs:
  debug-semgrep:
    name: "🔧 Debug Semgrep"
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Recuperation du code
        run: |
          set -euo pipefail
          mkdir -p /volume2/docker/monitoring_workspace
          cd /volume2/docker/monitoring_workspace
          curl -f -L \
            -H "Authorization: Bearer ${{ secrets.MY_GITHUB_TOKEN }}" \
            https://api.github.com/repos/NAS-HomeServer/HomeServer-monitoring/tarball/main \
            -o repo.tar.gz
          tar -xzf repo.tar.gz --strip-components=1
          rm repo.tar.gz

      - name: Semgrep debug complet vers fichier
        run: |
          mkdir -p /volume2/docker/monitoring_workspace/_debug_output
          docker run --rm \
            -v /volume2/docker/monitoring_workspace:/workspace \
            -w /workspace \
            semgrep/semgrep:1.95.0 \
            sh -c "semgrep scan --config p/ci --debug > /workspace/_debug_output/full.log 2>&1; echo EXIT:\$? >> /workspace/_debug_output/full.log"
        continue-on-error: true

      - name: Upload log complet
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-debug-log
          path: /volume2/docker/monitoring_workspace/_debug_output/full.log
          retention-days: 1