name: Debug Semgrep

on:
  workflow_dispatch:

jobs:
  debug-semgrep:
    name: "🔧 Debug Semgrep"
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Nettoyage complet
        run: |
          rm -rf /volume2/docker/monitoring_workspace
          mkdir -p /volume2/docker/monitoring_workspace

      - name: Espace disque
        run: df -h /volume2

      - name: Recuperation du code propre
        run: |
          set -euo pipefail
          cd /volume2/docker/monitoring_workspace
          curl -f -L \
            -H "Authorization: Bearer ${{ secrets.MY_GITHUB_TOKEN }}" \
            https://api.github.com/repos/NAS-HomeServer/HomeServer-monitoring/tarball/main \
            -o repo.tar.gz
          tar -xzf repo.tar.gz --strip-components=1
          rm repo.tar.gz
          echo "Contenu du repo:"
          find . -type f | head -50
          echo "Taille totale:"
          du -sh .

      - name: Semgrep sur repertoire propre
        run: |
          docker run --rm \
            -v /volume2/docker/monitoring_workspace:/workspace \
            -w /workspace \
            semgrep/semgrep:1.95.0 \
            sh -c "semgrep scan --config p/ci --debug 2>&1; echo EXIT:\$?"