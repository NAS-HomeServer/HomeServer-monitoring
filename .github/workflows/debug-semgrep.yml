name: Debug Semgrep

on:
  workflow_dispatch:

jobs:
  debug-semgrep:
    name: "🔧 Debug Semgrep"
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Recuperation du code
        run: |
          set -euo pipefail
          mkdir -p /volume2/docker/monitoring_workspace
          cd /volume2/docker/monitoring_workspace
          curl -f -L \
            -H "Authorization: Bearer ${{ secrets.MY_GITHUB_TOKEN }}" \
            https://api.github.com/repos/NAS-HomeServer/HomeServer-monitoring/tarball/main \
            -o repo.tar.gz
          tar -xzf repo.tar.gz --strip-components=1
          rm repo.tar.gz

      - name: Semgrep p ci seul sur vrai repo
        run: |
          docker run --rm \
            -v /volume2/docker/monitoring_workspace:/workspace \
            -w /workspace \
            semgrep/semgrep:1.95.0 \
            sh -c "semgrep scan --config p/ci --debug > /tmp/log.txt 2>&1; echo EXIT:\$?; cat /tmp/log.txt"

      - name: Semgrep 5 configs sur vrai repo
        run: |
          docker run --rm \
            -v /volume2/docker/monitoring_workspace:/workspace \
            -w /workspace \
            semgrep/semgrep:1.95.0 \
            sh -c "semgrep scan --config p/ci --config p/security-audit --config p/dockerfile --config p/yaml --config p/github-actions --debug > /tmp/log2.txt 2>&1; echo EXIT:\$?; cat /tmp/log2.txt"