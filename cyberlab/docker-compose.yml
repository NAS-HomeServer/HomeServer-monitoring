# Backends du cyberlab sur le NAS. Deploye par le playbook Ansible (tag
# "cyberlab") vers /volume2/docker/cyberlab/, aux cotes des dossiers
# sherlock/, dns_analyzer/ et audit_orchestrator/ qui contiennent les .env
# (secrets, jamais versionnes) referencees par env_file ci-dessous.
#
# Images des backends : publiees et signees (Cosign) par la CI de chaque depot
# sur GHCR, epinglees par digest. La signature est verifiee par le playbook
# Ansible avant deploiement. Mise a jour d'un backend : reporter le nouveau
# digest ici et dans signed_images du playbook.
# Dette technique restante : cloudflared est epingle par digest, mais sa
# version n'est pas suivie automatiquement.
#
# Le reseau "cyberlab" est cree par ce compose (nom fixe) ; le compose
# monitoring le rejoint en external: true pour sonder les backends.
# Durcissement commun : pas d'escalade de privilèges, aucune capability, système de fichiers en lecture seule
# (seul /tmp est inscriptible, en mémoire, sans exécution). Les tmpfs comptent dans mem_limit.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m

services:

  sherlock:
    image: ghcr.io/ag69075/cyberlab_sherlock_backend@sha256:3106a9a56b7094855a59adfd1dec44fd5a74b430ef5453fc6b09f6e929b10bcd
    container_name: sherlock
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - ALLOWED_ORIGINS=https://aginepro.work
    restart: unless-stopped
    <<: *hardening
    mem_limit: 1024M
    memswap_limit: 1024M
    pids_limit: 100
    user: 1000:1000

  cloudflared-sherlock:
    image: cloudflare/cloudflared@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    container_name: cloudflared_sherlock
    command: tunnel run
    env_file:
      - ./sherlock/.env
    restart: unless-stopped
    <<: *hardening
    mem_limit: 128M
    memswap_limit: 128M
    depends_on:
      - sherlock

  dns-analyzer:
    image: ghcr.io/ag69075/cyberlab_dns-analyzer@sha256:de4099797335e18b6d4423cca6143c9e3c0e4cda4841c4c037da876abd64f705
    container_name: dns_analyzer
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - ./dns_analyzer/.env
    restart: unless-stopped
    <<: *hardening
    mem_limit: 512M
    memswap_limit: 512M

  cloudflared-dns:
    image: cloudflare/cloudflared@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    container_name: cloudflared_dns_analyzer
    command: tunnel run
    env_file:
      - ./dns_analyzer/.env
    restart: unless-stopped
    <<: *hardening
    mem_limit: 128M
    memswap_limit: 128M
    depends_on:
      - dns-analyzer

  audit-orchestrator:
    image: ghcr.io/ag69075/cyberlab_audit_orchestrator@sha256:bba99f2a66d46eb0fa2c88f25e6e8f04ec427aec16b02a8871844726ea132217
    container_name: audit_orchestrator
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - ./audit_orchestrator/.env
    restart: unless-stopped
    <<: *hardening
    mem_limit: 512M
    memswap_limit: 512M

  cloudflared-audit:
    image: cloudflare/cloudflared@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    container_name: cloudflared_audit_orchestrator
    command: tunnel run
    env_file:
      - ./audit_orchestrator/.env
    restart: unless-stopped
    <<: *hardening
    mem_limit: 128M
    memswap_limit: 128M
    depends_on:
      - audit-orchestrator

networks:
  default:
    name: cyberlab
