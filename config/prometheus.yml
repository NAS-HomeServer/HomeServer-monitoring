global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  # 1. Surveillance du matériel du NAS (CPU, RAM, disques, réseau via OS)
  - job_name: 'synology-nas'
    static_configs:
      - targets: ['node-exporter:9100']

  # 2. Surveillance des conteneurs Docker via cAdvisor
  - job_name: 'docker-containers'
    scrape_interval: 60s
    static_configs:
      - targets: ['cadvisor:8080']

  # 3. Auto-surveillance de Prometheus lui-même
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
