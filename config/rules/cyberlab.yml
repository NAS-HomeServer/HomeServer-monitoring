groups:
  # Sondes blackbox (jobs blackbox-cyberlab-external / -internal / -internet).
  # Seuils par defaut, a recalibrer apres une semaine de donnees reelles.
  - name: cyberlab-probes
    rules:
      # Base de l'inhibition CyberlabProbeDown (cf. alertmanager.yml). "for"
      # plus court que celui de CyberlabProbeDown pour etre actif avant lui.
      - alert: InternetDown
        expr: probe_success{job="blackbox-internet"} == 0
        for: 1m
        labels:
          severity: critical
          service: cyberlab
        annotations:
          summary: "Connexion internet du NAS coupee"
          description: >-
            La sonde TCP vers {{ $labels.instance }} echoue depuis 1 minute : coupure internet
            domestique probable, les alertes de sondes externes du cyberlab sont inhibees.

      - alert: CyberlabProbeDown
        expr: probe_success{job=~"blackbox-cyberlab-(external|internal)"} == 0
        for: 3m
        labels:
          severity: critical
          service: cyberlab
        annotations:
          summary: "Sonde cyberlab en echec : {{ $labels.instance }}"
          description: "La sonde {{ $labels.job }} sur {{ $labels.instance }} echoue depuis plus de 3 minutes."

      - alert: CyberlabProbeSlow
        expr: probe_duration_seconds{job="blackbox-cyberlab-external"} > 1
        for: 10m
        labels:
          severity: warning
          service: cyberlab
        annotations:
          summary: "Sonde cyberlab lente : {{ $labels.instance }}"
          description: "{{ $labels.instance }} met {{ $value | humanizeDuration }} a repondre (seuil 1s) depuis plus de 10 minutes."

      - alert: CyberlabCertExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry{job="blackbox-cyberlab-external"} - time()) < 14 * 24 * 3600
        for: 1h
        labels:
          severity: warning
          service: cyberlab
        annotations:
          summary: "Certificat TLS proche de l'expiration : {{ $labels.instance }}"
          description: "Le certificat de {{ $labels.instance }} expire dans {{ $value | humanizeDuration }} (seuil 14 jours)."

      # Sans blackbox_exporter, probe_success disparait au lieu de passer a 0 :
      # CyberlabProbeDown ne se declencherait jamais.
      - alert: BlackboxExporterDown
        expr: up{job="blackbox-exporter"} == 0
        for: 3m
        labels:
          severity: critical
          service: cyberlab
        annotations:
          summary: "blackbox_exporter injoignable"
          description: "Prometheus ne joint plus blackbox_exporter depuis 3 minutes : plus aucune sonde cyberlab n'est evaluee."

  # Conteneurs du projet Docker "cyberlab", via cAdvisor (job docker-containers).
  - name: cyberlab-containers
    rules:
      # Liste attendue codee en dur (absent() ne sait pas dire QUEL conteneur
      # manque). Un conteneur est "vu" si cAdvisor l'a apercu il y a moins de
      # 2 minutes ; on n'alerte que si cAdvisor lui-meme est joignable, sinon
      # une panne de cAdvisor declencherait 6 fausses alertes.
      - alert: CyberlabContainerDown
        expr: |
          (
              label_replace(vector(1), "name", "sherlock", "", "")
            or label_replace(vector(1), "name", "dns_analyzer", "", "")
            or label_replace(vector(1), "name", "audit_orchestrator", "", "")
            or label_replace(vector(1), "name", "cloudflared_sherlock", "", "")
            or label_replace(vector(1), "name", "cloudflared_dns_analyzer", "", "")
            or label_replace(vector(1), "name", "cloudflared_audit_orchestrator", "", "")
          )
          unless on (name)
          (
            time() - container_last_seen{name=~"sherlock|dns_analyzer|audit_orchestrator|cloudflared_(sherlock|dns_analyzer|audit_orchestrator)"}
            < 120
          )
          and on () (up{job="docker-containers"} == 1)
        for: 1m
        labels:
          severity: critical
          service: cyberlab
        annotations:
          summary: "Conteneur cyberlab arrete : {{ $labels.name }}"
          description: "cAdvisor ne voit plus le conteneur {{ $labels.name }} depuis plus de 3 minutes (2 min sans le voir + 1 min de confirmation)."

      # Le filtre "> 0" exclut les conteneurs sans mem_limit : leur limite
      # vaut 0 dans cAdvisor, la division donnerait +Inf (fausse alerte).
      - alert: CyberlabContainerHighMemory
        expr: |
          container_memory_working_set_bytes{name=~"sherlock|dns_analyzer|audit_orchestrator|cloudflared_(sherlock|dns_analyzer|audit_orchestrator)"}
          / (container_spec_memory_limit_bytes{name=~"sherlock|dns_analyzer|audit_orchestrator|cloudflared_(sherlock|dns_analyzer|audit_orchestrator)"} > 0)
          > 0.85
        for: 5m
        labels:
          severity: warning
          service: cyberlab
        annotations:
          summary: "Memoire elevee : {{ $labels.name }}"
          description: "Le conteneur {{ $labels.name }} utilise {{ $value | humanizePercentage }} de sa limite memoire (seuil 85%) depuis plus de 5 minutes."
