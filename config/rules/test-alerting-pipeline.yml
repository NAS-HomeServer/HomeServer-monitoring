groups:
  - name: test-alerting-pipeline
    rules:
      # Toujours a l'etat "firing" (expr constante, for: 0m) : sert a verifier
      # en continu que la chaine Prometheus -> Alertmanager -> Discord est
      # vivante, independamment de toute regle metier. Ne pas supprimer sans
      # la remplacer par une vraie regle de garde (pattern "Watchdog").
      - alert: TestAlertingPipeline
        expr: vector(1)
        for: 0m
        labels:
          severity: info
        annotations:
          summary: "Test de la chaine d'alerting"
          description: "Regle toujours active utilisee pour verifier que Prometheus -> Alertmanager -> Discord fonctionne de bout en bout."
