route:
  receiver: discord
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

# Coupure internet domestique : les sondes externes echouent toutes, ce n'est
# pas une panne de service. Seul le job "external" est cible : les sondes
# internes (reseau Docker local) et cAdvisor ne dependent pas d'internet, une
# vraie panne locale doit rester visible pendant la coupure. Pas de "equal" :
# InternetDown n'a pas de label commun avec les alertes ciblees.
inhibit_rules:
  - source_matchers:
      - alertname = "InternetDown"
    target_matchers:
      - alertname = "CyberlabProbeDown"
      - job = "blackbox-cyberlab-external"

  # Meme source, cible distincte : CyberlabContainerDown n'a pas de label "job"
  # (il vient d'un vector() + label_replace, pas d'un scrape), donc le matcher
  # job ci-dessus ne peut pas s'y appliquer. On cible par alertname + le label
  # "name" du conteneur, et seulement les 3 tunnels cloudflared : les backends
  # (sherlock, dns_analyzer, audit_orchestrator) ne dependent pas d'internet,
  # leur crash pendant une coupure est un incident distinct a garder visible.
  # Les matchers regex sont ancres : la liste explicite reprend celle de la
  # regle CyberlabContainerDown.
  - source_matchers:
      - alertname = "InternetDown"
    target_matchers:
      - alertname = "CyberlabContainerDown"
      - name =~ "cloudflared_(sherlock|dns_analyzer|audit_orchestrator)"

receivers:
  - name: discord
    discord_configs:
      # webhook_url_file (pas webhook_url) : le secret est deploye a part par
      # Ansible sur le volume alertmanager_config, jamais commite ici.
      - webhook_url_file: /etc/alertmanager/secrets/discord_webhook
        send_resolved: true
