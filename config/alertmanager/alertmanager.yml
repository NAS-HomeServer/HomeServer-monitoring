route:
  receiver: discord
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: discord
    discord_configs:
      # webhook_url_file (pas webhook_url) : le secret est deploye a part par
      # Ansible sur le volume alertmanager_config, jamais commite ici.
      - webhook_url_file: /etc/alertmanager/secrets/discord_webhook
        send_resolved: true
